    let lo2=0,hi2=dates.length-1;while(hi2-lo2>1){const m=(lo2+hi2)>>1;(+dates[m]<t)?lo2=m:hi2=m}const i=(t-+dates[lo2]<+dates[hi2]-t)?lo2:hi2;
