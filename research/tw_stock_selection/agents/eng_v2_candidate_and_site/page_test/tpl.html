<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--color-fg:#1a1a1a;--color-fg-muted:#5f5f5f;--color-bg:#fafaf7;--color-panel:#fff;--color-border-line:#e3e1db;--color-ok:#2e7d32;--color-warn:#b26a00;--color-bad:#c62828;
--font-anthropic-sans:system-ui,sans-serif;--font-anthropic-serif:Georgia,serif;--cds-font-size-caption:12px;--cds-font-size-body:14px;--cds-font-size-heading:18px;--cds-font-size-title:28px;--cds-font-weight-medium:600;
--cds-gap-xs:4px;--cds-gap-sm:8px;--cds-gap-md:12px;--cds-gap-lg:20px;--cds-gap-xl:28px;--cds-pad-xs:4px;--cds-pad-sm:8px;--cds-pad-md:12px;--cds-pad-lg:16px;--cds-radius:8px;
--c1:#2a6fdb;--c2:#d9822b;--c3:#7a7a7a;--cds-chart-grid:#eee;--cds-chart-axis:#ccc;--cds-chart-reference:#999;--cds-text-secondary:#666;--cds-surface-popover:#fff;--cds-border:#ddd;--cds-shadow-popover:0 2px 8px rgba(0,0,0,.15)}
@media (prefers-color-scheme: dark){:root{--color-fg:#eee;--color-fg-muted:#aaa;--color-bg:#1b1b1b;--color-panel:#242424;--color-border-line:#3a3a3a;--color-ok:#66bb6a;--color-warn:#ffb74d;--color-bad:#ef5350;--cds-chart-grid:#333;--cds-chart-axis:#555;--cds-text-secondary:#aaa;--cds-surface-popover:#2c2c2c;--cds-border:#444}}
body{margin:0;background:var(--color-bg);color:var(--color-fg);font-family:var(--font-anthropic-sans)}
#dash-root{padding:16px}
</style>
<script src="D3PATH"></script>
</head><body><div id="dash-root"><!--PAGE--></div>
<script>
/*DATA*/
window.__faults=[]; window.__errors=[];
window.addEventListener('error', e => __errors.push(String(e.message)));
const ALLOWED=['class','style','hidden','open','disabled','checked','selected','value','tabindex'];
const draws={}, calcs={}, onDatas=[]; let inDraw=0;
function inHidden(el){ return !!el.closest('[hidden]'); }
const dash={
  colors:['var(--c1)','var(--c2)','var(--c3)'],
  data(id){ if(calcs[id]){ const c=calcs[id]; const ins=c.inputs.map(i=>{const d=dash.data(i); return d.status==='ok'?d.data:[];}); return {status:'ok',data:c.fn(...ins)}; }
    if(__STATUS[id]==='error') return {status:'error',data:[],error:'模擬載入失敗'};
    if(__DATA[id]) return {status:'ok',data:__DATA[id],meta:__META[id],columns:Object.keys(__DATA[id][0]||{})}; return {status:'missing',data:[]}; },
  calc(id,o){calcs[id]=o;}, loader(){}, onData(fn){onDatas.push(fn); fn();},
  draw(name,fn){ if(fn){draws[name]=fn; return;} runDraw(name); },
  params(){return {};}, setParams(){}, resetParams(){}, setLink(){}, refresh(){}
};
const mounted=new WeakMap();
function runDraw(name){ const fn=draws[name]; if(!fn) return; document.querySelectorAll('[data-draw="'+name+'"]').forEach(el=>{ if(inHidden(el)) return; inDraw++; try{
  if(typeof fn==='function') fn(el); else { if(!mounted.has(el)){ el.replaceChildren(); mounted.set(el, fn.mount?fn.mount(el):undefined);} fn.update&&fn.update(el,mounted.get(el)); }
 }catch(e){__errors.push(name+': '+e.message);} finally{inDraw--;} }); }
function runAll(){ onDatas.forEach(f=>{try{f()}catch(e){__errors.push('onData: '+e.message)}}); Object.keys(draws).forEach(runDraw); }
window.dash=dash;
const mo=new MutationObserver(ms=>{ ms.forEach(m=>{ const t=m.target.nodeType===1?m.target:m.target.parentElement; if(!t) return; if(t.closest('[data-draw]')) return;
  if(m.type==='attributes' && (ALLOWED.includes(m.attributeName)||m.attributeName.startsWith('aria-'))) return;
  if(t.closest('.tip')) return;
  __faults.push(m.type+' '+(m.attributeName||'')+' on '+t.tagName+'#'+t.id+'.'+t.className); }); });
mo.observe(document.getElementById('dash-root'),{subtree:true,childList:true,attributes:true,characterData:true}); __SCRIPTS.forEach(s=>{ try{ (0,eval)(s);}catch(e){__errors.push('script: '+e.message);} });
runAll();
let lw=innerWidth; addEventListener('resize',()=>{ if(innerWidth!==lw){lw=innerWidth; runAll();} });
</script></body></html>
